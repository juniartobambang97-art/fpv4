<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - FPV4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h2>Dashboard</h2>
  <button id="logoutBtn" class="btn-logout">Logout</button>
</header>

<main>
  <section class="profile">
    <h3>Halo, <span id="userName">User</span> 👋</h3>
    <p id="userEmail"></p>
  </section>

  <section>
    <h3>Profil Konveksi</h3>
    <input id="bizName" placeholder="Nama bisnis">
    <textarea id="bizAddress" placeholder="Alamat bisnis"></textarea>
    <input id="bizMaps" placeholder="Google Maps Location">
    <button onclick="saveProfile()">Simpan Profil</button>
  </section>

  <section>
    <h3>Etalase Produk</h3>
    <div id="products" class="products"></div>
    <button onclick="createProduct()">+ Create Product</button>
  </section>

  <section>
    <h3>Pesanan Produksi</h3>
    <div id="orders"><p>Belum ada pesanan.</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
