<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Detail Produk - FPV4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div>
    <h2>Detail Produk</h2>
  </div>
  <a href="etalase.html" class="btn btn-sm btn-ghost">← Etalase</a>
</header>

<main id="mainContent">
  <div class="empty" style="grid-column:1/-1">Memuat detail...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get('id');

async function loadDetail() {
  if (!productId) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">Produk tidak ditemukan.</div>';
    return;
  }

  const { data: product, error } = await sb.from('products').select('*, profiles(biz_name, biz_address)').eq('id', productId).single();

  if (error || !product) {
    document.getElementById('mainContent').innerHTML = '<div class="empty">Produk tidak ditemukan.</div>';
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  
  // 🔒 CEK: Apakah user yang login adalah pemilik produk ini?
  const isOwner = session && session.user.id === product.owner_id;

  let orderSection = '';
  if (isOwner) {
    // Jika pemilik, tampilkan pesan blokir
    orderSection = `
      <div class="empty" style="margin-top:16px">
        <span>🪞</span>
        <p><strong>Ini adalah produk Anda sendiri.</strong><br>Anda tidak dapat memesan produk sendiri.</p>
      </div>
    `;
  } else if (session) {
    // Jika user lain yang login, tampilkan form order
    orderSection = `
      <form id="orderForm">
        <label for="qty">Jumlah Pesanan (pcs)</label>
        <input type="number" id="qty" min="${product.min_order}" value="${product.min_order}" required>
        <p style="font-size:12px; color:var(--muted); margin-top:4px;">Estimasi Total: <strong id="estTotal">Rp${Number(product.price * product.min_order).toLocaleString('id-ID')}</strong></p>

        <label for="notes" style="margin-top:12px">Catatan untuk Konveksi</label>
        <textarea id="notes" placeholder="Cth: Warna merah marun, sablon di dada kiri..." rows="3"></textarea>

        <button type="submit" class="btn-block" style="margin-top:16px">📩 Ajukan Pesanan</button>
      </form>
    `;
  } else {
    // Jika belum login
    orderSection = `
      <div class="empty" style="margin-top:16px">
        <span>🔒</span>
        <p>Silakan <a href="login.html?redirect=detail.html?id=${productId}">Login</a> untuk mengajukan pesanan.</p>
      </div>
    `;
  }

  document.getElementById('mainContent').innerHTML = `
    <section>
      <div class="detail-hero">
        <div>
          <img src="${product.image_url || 'https://via.placeholder.com/600x400?text=No+Image'}" class="detail-img" onerror="this.src='https://via.placeholder.com/600x400?text=Error'">
        </div>
        <div class="detail-info">
          <span class="cat-badge">${product.category || 'Lainnya'}</span>
          <h2>${product.name}</h2>
          <div class="detail-price">Rp${Number(product.price).toLocaleString('id-ID')} <span style="font-size:14px; font-weight:400; color:var(--muted)">/ pcs</span></div>
          
          <div class="detail-meta">
            <span class="badge">MOQ: ${product.min_order} pcs</span>
          </div>

          <div class="seller-box">
            <strong>🏭 ${product.profiles?.biz_name || 'Konveksi'}</strong>
            <p style="font-size:13px; color:var(--muted); margin:4px 0 0;">${product.profiles?.biz_address || 'Alamat tidak tersedia'}</p>
          </div>

          ${orderSection}
        </div>
      </div>
    </section>
  `;

  // Logic form order (hanya jalan jika bukan owner)
  if (!isOwner && session) {
    const qtyInput = document.getElementById('qty');
    qtyInput.addEventListener('input', () => {
      const q = Math.max(product.min_order, Number(qtyInput.value) || product.min_order);
      document.getElementById('estTotal').textContent = 'Rp' + Number(q * product.price).toLocaleString('id-ID');
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      setLoading(btn, true, 'Mengajukan...');

      const qty = Number(document.getElementById('qty').value);
      const notes = document.getElementById('notes').value.trim();

      const { error: orderError } = await sb.from('orders').insert({
        product_id: product.id,
        seller_id: product.owner_id,
        buyer_id: session.user.id,
        buyer_name: session.user.user_metadata?.full_name || 'Pembeli',
        qty: qty,
        notes: notes,
        total_price: qty * product.price,
        status: 'pending'
      });

      setLoading(btn, false);
      if (orderError) toast('❌ Gagal: ' + orderError.message, 'error');
      else {
        toast('✅ Pesanan berhasil diajukan!');
        setTimeout(() => location.href = 'etalase.html', 1500);
      }
    });
  }
}
loadDetail();
</script>
</body>
</html>
