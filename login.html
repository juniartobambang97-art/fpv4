<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Login - FPV4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div>
    <h2>FastProduction V4</h2>
    <p>Marketplace Produksi Konveksi</p>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-box">
    <h3>Masuk ke Akun Anda</h3>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="pw-toggle">👁</button>
      </div>

      <button type="submit" class="btn-block" style="margin-top:16px" id="loginBtn">Login</button>
    </form>
    <p id="msg" class="msg"></p>
    <p class="auth-alt">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
