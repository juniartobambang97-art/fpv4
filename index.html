<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>FastProduction V4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div>
    <h2>FastProduction V4</h2>
    <p>Marketplace Produksi Konveksi</p>
  </div>
</header>
<main>
  <section class="hero">
    <h3 id="heroTitle">Selamat Datang 👋</h3>
    <p id="heroDesc">Kelola konveksimu, tayangkan etalase produk, dan terima pesanan dalam satu tempat.</p>
    <div class="btn-group" id="authButtons">
      <a href="etalase.html" class="btn">🛍️ Lihat Etalase Publik</a>
      <a href="login.html" class="btn btn-ghost">Login / Daftar</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
  // Cek sesi saat halaman dimuat
  (async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      const name = data.session.user.user_metadata?.full_name || 'User';
      document.getElementById('heroTitle').textContent = `Halo, ${name}! 👋`;
      document.getElementById('authButtons').innerHTML = `
        <a href="etalase.html" class="btn btn-ghost">🛍️ Lihat Etalase</a>
        <a href="dashboard.html" class="btn">🚀 Ke Dashboard</a>
      `;
    }
  })();
</script>
</body>
</html>
